controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_joint_position_controller:
      type: position_controllers/JointGroupPositionController

    gripper_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters: {}

arm_joint_position_controller:
  ros__parameters:
    joints:
      - base_rotator
      - shoulder_pitch
      - elbow_pitch
      - wrist_pitch
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_position_controller:
  ros__parameters:
    joints:
      - gripper_joint
      - gripper_joint_right
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
